name: Deploy Application

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: Build Application
      run: mvn clean package -DskipTests

    - name: Build Docker Image
      run: |
        docker build -t smartcare-cli:latest .
        docker tag smartcare-cli:latest smartcare-cli:${{ github.sha }}

    - name: Push to Docker Registry
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
        docker push smartcare-cli:latest
        docker push smartcare-cli:${{ github.sha }}
      if: secrets.DOCKER_USERNAME != ''

    - name: Deploy to Server
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
          cd /opt/smartcare-clinic
          docker-compose pull
          docker-compose up -d
        EOF
      if: secrets.DEPLOY_HOST != ''
      continue-on-error: true

    - name: Notification
      run: echo "Deployment completed successfully!"
      if: success()
