version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: smartcare_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: smartcare_clinic
      MYSQL_USER: smartcare_user
      MYSQL_PASSWORD: smartcare_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./database/stored_procedures.sql:/docker-entrypoint-initdb.d/stored_procedures.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  mongodb:
    image: mongo:5.0
    container_name: smartcare_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: smartcare_clinic
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: smartcare_backend
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smartcare_clinic?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: smartcare_user
      SPRING_DATASOURCE_PASSWORD: smartcare_pass
      SPRING_DATA_MONGODB_URI: mongodb://admin:admin123@mongodb:27017/smartcare_clinic?authSource=admin
    ports:
      - "8080:8080"
    networks:
      - smartcare_network

  frontend:
    image: nginx:alpine
    container_name: smartcare_frontend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - smartcare_network

volumes:
  mysql_data:
  mongodb_data:

networks:
  smartcare_network:
    driver: bridge
